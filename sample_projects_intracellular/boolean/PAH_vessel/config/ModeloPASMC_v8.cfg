// ModeloPASMC_base_v2_TRPC6_feedback.cfg -- see .bnd header for the literature extension.
// =====================================================================
//  ModeloV7_corregido.cfg
//  Escenario por defecto: célula en reposo, SNX29 normal, sin fármacos.
//  Base: PASMC_SOCE_v6b.cfg
// =====================================================================

// ---------------- parámetros de simulación ----------------
time_tick = 0.5;
max_time  = 200;   // ampliado: con CREC no absorbente el crecimiento
                   // tarda mas en equilibrar. Verificado antes de fijar readouts.
sample_count = 1000;
discrete_time = 0;
use_physrandgen = 0;
seed_pseudorandom = 100;
display_traj = 0;
statdist_traj_count = 0;
thread_count = 4;


// =====================================================================
//  PARÁMETROS HEREDADOS DE v4 / v5 / v6
// =====================================================================
$k_fast   = 10;     // procesos eléctricos / rápidos
$u_ca     = 1;      // entrada de calcio por vía abierta
$d_ca     = 1;      // extrusión y recaptación (incluye NCX directo)
$u_mlck   = 5;
$d_mlck   = 5;
$u_con    = 5;      // fosforilación de miosina por MLCK
$d_con    = 5;      // desfosforilación con MLCP activa
$k_transc = 0.1;
$u_nfat   = 0.2;
$d_nfat   = 0.2;
$u_cn     = 1;
$d_cn     = 1;
$u_crec   = 0.05;
$d_crec   = 0.025;
$u_kv     = 0.1;

$u_sr      = 10;
$f_recarga_baja = 0.3;  // v6b INTACTO: recarga más lenta cuando citosol tiene poco Ca
$d_sr_fuga = 0.5;
$d_sr_ip3  = 20;
$f_hipox   = 8;
$u_stim    = 1;
$d_stim    = 1;
$d_stim_off = 5;
$drive_cpa = 8;

$f_snx29   = 1.0;   // 0.5 bajo · 1.0 normal · 2.0 alto
$leak_nfat = 0.02;

// ---- Calibraciones consolidadas en v6 (INTACTAS) ----
$u_ltcc     = 10;   // apertura de CaV1.2 bajo despolarización
$d_ltcc     = 0.5;  // cierre basal
$block_amlo = 200;  // CALIBRADO EN v6 (no en v7) contra ancla externa: abolir el
                    // incremento de contraccion inducido por KCl en anillo arterial.
                    // Criterio declarado entonces: <=10% del incremento. Cumple al 5,5%.

$u_rock      = 1;
$d_rock      = 1;
$d_rock_gap  = 1;   // FRENO RhoGAP v6 (d_rock_gap=1 hace ROCK graduado)
$u_mlcp      = 1;
$d_mlcp      = 1;
$u_con_basal = 0.5; // fosforilación basal independiente de calcio
$d_con_sens  = 0.5; // desfosforilación lenta con MLCP inhibida

$u_trpc6 = 10;      // apertura rápida por DAG
$d_trpc6 = 1;       // recambio de TRPC6
$u_nfat_trpc6 = 0.1; // NUEVO, SIN CALIBRAR: induccion transcripcional de TRPC6 via NFAT (Kuwahara 2006) -- igual a $k_transc
$u_pkc   = 0.5;     // cinética más lenta que TRPC6 (freno de coincidencia)
$d_pkc   = 0.5;

$u_ncx = 1;
$d_ncx = 1;

// ---- CORRECCIONES DE FIDELIDAD CELULAR (modelo base). SIN CALIBRAR ----
$d_ltcc_cdi   = 2.0;   // 4. inactivacion del CaV1.2 por calcio. Elegido para que
                       //    la CDI domine sobre el cierre basal ($d_ltcc = 0,5),
                       //    que es la fisiologia, NO ajustado a ningun resultado
$f_extr       = 0.5;   // 5. cuanto acelera la extrusion por cada via abierta
$u_mlcp_resid = 0.25;

// ---- REVISION NODO A NODO. SIN CALIBRAR ----
$d_soce_cdi   = 2.0;   // R1. CDI del ORAI1. MISMO valor que $d_ltcc_cdi a proposito
$d_plc_desens = 0.2;   // R3. desensibilizacion de ET-1, lenta frente a la activacion  // 6. actividad residual de la MLCP bajo inhibicion por
                       //    ROCK/PKC (~25 % de la basal)

// ---- BLOQUE 1: canal BK (KCNMA1). SIN CALIBRAR ----
$u_bk     = 10;  // canal ionico: apertura rapida, como $k_fast
$d_bk     = 1;   // recambio del canal, como $d_trpc6
$d_em_bk  = 1;   // fuerza del freno sobre la despolarizacion. Elegido un orden
                 // de magnitud por debajo del impulso despolarizante ($k_fast=10),
                 // NO ajustado a ningun resultado. Entra al barrido.


// =====================================================================
//  PARÁMETROS NUEVOS DE v7
// =====================================================================
// 1. Acoplamiento excitación-transcripción: CaV1.2 aporta a Calcineurina
// $u_cn_ltcc ELIMINADO en el bloque 2: era una asimetria arbitraria de la que
// dependia el resultado principal. Los dos microdominios pesan igual ($u_cn).

// 2. Vía de hipoxia independiente de calcio (HIF-1α)
$u_hif = 0.2;       // estabilización y translocación de HIF-1α bajo hipoxia
$d_hif = 0.2;       // degradación rápida por PHDs/VHL en normoxia

// 3. Pesos de crecimiento multifactorial (CREC_1).
// AVISO: NO son una calibracion. Son valores elegidos por orden de magnitud,
// sin ancla externa ni criterio previo. Entran en el barrido de sensibilidad.
$u_crec_hif  = 0.04; // componente dominante de hipoxia crónica a largo plazo
$u_crec_nfat = 0.02; // componente de NFAT (vía calcio / SNX29 residual)


// ---------------- entradas ----------------
AMLO.istate    = 0;
ET1.istate     = 0;
HIPOXIA.istate = 0;
K_ALTO.istate  = 0;
CPA.istate     = 0;

CACNA1C.istate = 1;
STIM1.istate   = 1;
ORAI1.istate   = 1;
ATP2A2.istate  = 1;
TRPC6.istate   = 1;


// ---------------- estado inicial: célula en reposo ----------------
Kv1_5.istate        = 1;
Serca.istate        = 1;
Sr_lleno.istate     = 1;
Em_depol.istate     = 0;
Ltcc.istate         = 0;
Plc.istate          = 0;
Stim1_pm.istate     = 0;
Soce.istate         = 0;
Trpc6.istate        = 0;
Pkc.istate          = 0;
Ncx_rev.istate      = 0;
Ca_global.istate    = 0;
Ca_local.istate     = 0;
Ca_ltcc.istate      = 0;
Rock.istate         = 0;
Bkca.istate         = 0;
Mlcp.istate         = 1;   // fosfatasa activa en reposo
Mlck.istate         = 0;
Calcineurina.istate = 0;
Nfat.istate         = 0;
Hif1a.istate        = 0;   // normoxia basal (HIF-1α ausente)
CONTR_1.istate      = 0;
CONTR_2.istate      = 0;
CREC_1.istate       = 0;
CREC_2.istate       = 0;


// ---------------- qué se reporta ----------------
AMLO.is_internal    = TRUE;
ET1.is_internal     = TRUE;
HIPOXIA.is_internal = TRUE;
K_ALTO.is_internal  = TRUE;
CPA.is_internal     = TRUE;
CACNA1C.is_internal = FALSE;  // v8: ahora es dinamico, hay que poder verlo caer
STIM1.is_internal = FALSE;
ORAI1.is_internal = FALSE;
ATP2A2.is_internal = FALSE;

Kv1_5.is_internal        = TRUE;
Em_depol.is_internal     = TRUE;
Plc.is_internal          = TRUE;
Serca.is_internal        = TRUE;
Calcineurina.is_internal = TRUE;

Sr_lleno.is_internal  = FALSE;
Stim1_pm.is_internal  = FALSE;
Soce.is_internal      = FALSE;
Ltcc.is_internal      = FALSE;
Trpc6.is_internal     = FALSE;
Pkc.is_internal       = FALSE;
Ncx_rev.is_internal   = FALSE;
Ca_global.is_internal = FALSE;
Ca_local.is_internal  = FALSE;
Ca_ltcc.is_internal   = FALSE;
Rock.is_internal      = FALSE;
Bkca.is_internal      = FALSE;
Mlcp.is_internal      = FALSE;
Mlck.is_internal      = FALSE;
Nfat.is_internal      = FALSE;
Hif1a.is_internal     = FALSE;  // Visible para monitorizar estabilización de HIF-1α
CONTR_1.is_internal   = FALSE;
CONTR_2.is_internal   = FALSE;
CREC_1.is_internal    = FALSE;
CREC_2.is_internal    = FALSE;

// =====================================================================
// v8 -- PARAMETROS NUEVOS
// =====================================================================
// --- CACNA1C dinamico (CAMBIO ESTRUCTURAL) -------------- SIN CALIBRAR
// $d_cav es LENTO a proposito: es recambio de proteina/transcrito (dias), no
// compuerta (ms). Con Myocd=1 el estacionario es 5/5.05 = 0.990, que preserva
// el comportamiento del modelo base, donde CACNA1C era una entrada fija en 1.
// Con Myocd=0 el residual es 0.02/0.07 = 0.286, del mismo orden que el residual
// de la MLCP ($u_mlcp_resid = 0.25) y por el mismo motivo.
$u_cav       = 5.0;    // SIN CALIBRAR
$d_cav       = 0.05;   // SIN CALIBRAR (lento: expresion, no compuerta)
$u_cav_resid = 0.02;   // SIN CALIBRAR (residual del estado sintetico)

// --- Kv1_5 dependiente de Myocd ------------------------- SIN CALIBRAR
$u_kv_resid  = 0.02;   // SIN CALIBRAR: residual, frente a $u_kv = 0.1

// --- toggle KLF4 -| MYOCD ----------- VALORES DE PRIMERA APROXIMACION
// Son los del prompt. SE CALIBRAN en el paso siguiente contra los dos criterios
// (fraccion parcial con ET-1 = convencion; K+ cerca del basal = ancla externa).
$u_klf4      = 0.05;   // POR CALIBRAR
$d_klf4      = 0.5;    // POR CALIBRAR
$leak_klf4   = 0.002;  // POR CALIBRAR
$u_myocd     = 0.5;    // SIN CALIBRAR: restitucion del programa contractil
$d_myocd     = 0.5;    // SIN CALIBRAR: perdida del programa bajo Klf4

// --- resistencia a apoptosis -------- SIN ANCLA, NO VALIDABLE EN ESTA FASE
$u_resist    = 0.2;    // SIN CALIBRAR (mismo orden que $u_nfat)
$d_resist_on = 0.05;   // SIN CALIBRAR
$d_resist    = 0.5;    // SIN CALIBRAR

// --- tercer brazo de TRPC6, desde el estado sintetico --- SIN CALIBRAR
$u_klf4_trpc6 = 0.1;   // SIN CALIBRAR (mismo orden que $u_nfat_trpc6)

// =====================================================================
// v8 -- ESTADOS INICIALES DE LOS NODOS NUEVOS
// =====================================================================
// Celula CONTRACTIL sana de partida.
Klf4.istate        = 0;
Myocd.istate       = 1;
Resist_apop.istate = 0;

Klf4.is_internal        = FALSE;  // es la lectura central de esta fase
Myocd.is_internal       = FALSE;
Resist_apop.is_internal = FALSE;
